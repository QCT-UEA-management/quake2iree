name: MLIR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: marhvera/llvm-dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja ..

      - name: Build project
        run: |
          cd build
          ninja -j4

      - name: Make library executable
        run: chmod +x build/tool/q2i-opt

      - name: Run MLIR conversion test via Python
        run: |
          cd test
          python3 test_mlir_conversion.py
