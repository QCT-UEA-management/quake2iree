name: MLIR CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build devcontainer image
        run: |
          docker build \
            -f .devcontainer/Dockerfile \
            -t quake2iree-ci \
            .devcontainer

      - name: Build and test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspaces/quake2iree" \
            -w /workspaces/quake2iree \
            quake2iree-ci \
            bash -lc './scripts/build.sh && pytest test/test_circuits.py -v'
