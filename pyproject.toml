[project]
name = "quake2iree"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "iree-compiler",
    "iree-runtime",
    "numpy",
    "matplotlib",
    "pytest",
]

[project.optional-dependencies]
# Install with: uv sync --extra cuda
cuda = [
    "cuda-quantum-cu12>=0.13.0",
]

[tool.uv]
# Do not install this repo as a Python package (it is a C++ tool with Python scripts).
package = false
# NVIDIA package index required for cuda-quantum.
extra-index-url = ["https://pypi.nvidia.com"]
